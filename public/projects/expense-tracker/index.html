<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expense Tracker</title>
<style>
  :root { --accent: #42e695; --bg: #0a0a12; --panel: #14141f; --text: #ecedf5; --muted: #9aa0b5; --border: #262636; --red: #ff6a8a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;
    color: var(--text); background: radial-gradient(60% 50% at 50% 0%, #0e2a1d, var(--bg));
    display: flex; justify-content: center; padding: 2rem 1rem; }
  .app { width: min(560px, 100%); }
  h1 { margin: 0 0 0.25rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; }
  .balance { background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
  .balance small { color: var(--muted); }
  .balance .amount { font-size: 2.2rem; font-weight: 700; }
  .split { display: flex; gap: 1rem; margin-top: 0.75rem; }
  .split div { flex: 1; }
  .income { color: var(--accent); font-weight: 600; }
  .expense { color: var(--red); font-weight: 600; }
  form { display: grid; grid-template-columns: 1fr 120px auto; gap: 0.5rem; margin-bottom: 1.5rem; }
  input, select, button { padding: 0.7rem 0.8rem; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 0.95rem; }
  button { background: var(--accent); color: #06301d; border: none; font-weight: 700; cursor: pointer; grid-column: 1 / -1; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.5rem; }
  li { display: flex; justify-content: space-between; align-items: center; background: var(--panel);
    border: 1px solid var(--border); border-left-width: 4px; border-radius: 10px; padding: 0.7rem 1rem; }
  li.plus { border-left-color: var(--accent); }
  li.minus { border-left-color: var(--red); }
  li button { background: none; color: var(--muted); border: none; cursor: pointer; font-size: 1.1rem; width: auto; padding: 0 0 0 0.75rem; }
  .empty { color: var(--muted); text-align: center; padding: 2rem; }
</style>
</head>
<body>
<div class="app">
  <h1>Expense Tracker</h1>
  <p class="sub">Track income and spending — saved in your browser.</p>
  <div class="balance">
    <small>Balance</small>
    <div class="amount" id="balance">$0.00</div>
    <div class="split">
      <div><small>Income</small><div class="income" id="income">+$0.00</div></div>
      <div><small>Expense</small><div class="expense" id="expenseTotal">-$0.00</div></div>
    </div>
  </div>
  <form id="form">
    <input id="desc" placeholder="Description" required />
    <input id="amount" type="number" step="0.01" placeholder="Amount" required />
    <select id="type"><option value="income">Income</option><option value="expense">Expense</option></select>
    <button type="submit">Add transaction</button>
  </form>
  <ul id="list"></ul>
</div>
<script>
  const KEY = 'expense-tracker';
  let txns = JSON.parse(localStorage.getItem(KEY) || '[]');
  const fmt = (n) => '$' + Math.abs(n).toFixed(2);
  const $ = (id) => document.getElementById(id);

  function save() { localStorage.setItem(KEY, JSON.stringify(txns)); }
  function render() {
    const list = $('list'); list.innerHTML = '';
    if (!txns.length) { list.innerHTML = '<div class="empty">No transactions yet. Add one above.</div>'; }
    let income = 0, expense = 0;
    txns.forEach((t) => {
      if (t.amount >= 0) income += t.amount; else expense += t.amount;
      const li = document.createElement('li');
      li.className = t.amount >= 0 ? 'plus' : 'minus';
      li.innerHTML = `<span>${t.desc}</span><span>${t.amount >= 0 ? '+' : '-'}${fmt(t.amount)}
        <button title="Delete" data-id="${t.id}">&times;</button></span>`;
      list.appendChild(li);
    });
    $('balance').textContent = (income + expense < 0 ? '-' : '') + fmt(income + expense);
    $('income').textContent = '+' + fmt(income);
    $('expenseTotal').textContent = '-' + fmt(expense);
  }
  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const amt = parseFloat($('amount').value);
    const signed = $('type').value === 'expense' ? -Math.abs(amt) : Math.abs(amt);
    txns.push({ id: Date.now(), desc: $('desc').value, amount: signed });
    save(); render(); e.target.reset();
  });
  $('list').addEventListener('click', (e) => {
    if (e.target.dataset.id) { txns = txns.filter((t) => t.id != e.target.dataset.id); save(); render(); }
  });
  render();
</script>
</body>
</html>
